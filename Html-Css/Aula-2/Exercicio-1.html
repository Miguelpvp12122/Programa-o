<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafo</title>
</head>
<body>
    <h1>Parágrafos e quebra linha</h1>
    <hr>
    <p>Você pode criar parágrafo a qualquer hora <br>
        basta fazer entre a tag &lt;p&gt; e &lt;/p&gt;. <!--&lt; é o sinal de < e &gt; é o sinal de >-->
    </p>
    <p>Se precisar quebrar uma linha <br>
        como está <br>
        basta usar a tag &lt;br&gt;.
    </p>
</body>
</html>
