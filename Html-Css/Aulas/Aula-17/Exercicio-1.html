<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Audio em HTML</h1>
    <p>Vamos aprender a inserir audios no HTML</p>
    <audio preload="metadata" controls>
        <source src="Arqu-MP3/OLOKO.mp3" type="audio/mpeg">
        <source src="Arqu-MP3/OLOKO.ogg" type="audio/ogg">
        <source src="Arqu-MP3/OLOKO.wav" type="audio/wav">
        <p>Seu navegador não é compativel a nenhum tipo de audio caso ainda queira ver <a href="Arqu-MP3/OLOKO.mp3">baixe ele!</a></p>
    </audio>
    
    <p>Parametros: <strong>preload, controls, loop e autoplay</strong></p>
    <!-- MP3 WAV OGG-->
</body>
</html>
