<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos em HTML</title>
</head>
<body>
    <h1>Videos em html</h1>
    <p>Aqui está um video em html!</p>
    <video controls preload="metadata" poster="Imagens/Cachoira 🔥.png">
        <source src="Videos/Video_mp4.mp4" type="video/mp4">
        <source src="Videos/Video_m4v.m4v" type="video/x-m4v">
        <source src="Videos/Video_m4v.m4v" type="video/ogg">
        <p>Seu navegador não é compativel com nenhum dos modelos de videos</p>
    </video>
    <p>Este video está hospedado no meu proprio servidor</p>

</body>
</html>
